# MMDetection-CCF-compatible Swin-NP control experiment.  Perturb only the
# normalized outputs selected by OUT_INDICES before they enter IMAGE_NECK;
# the Swin main path remains clean and each output stage samples p separately.
MODEL:
    IMAGE_BACKBONE:
        FEATURE_PERTURBATION:
            ENABLED: True
            METHOD: np
            PLACEMENT: output_branches
            PROBABILITY: 0.5
            NOISE_STD: 0.75
            MEAN_SCALE_FACTOR: 1.5
            EPS: 0.000001
