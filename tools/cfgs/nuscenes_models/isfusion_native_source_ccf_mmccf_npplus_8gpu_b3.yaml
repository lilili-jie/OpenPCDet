# MMDetection-CCF-compatible Swin-NP+ feature-only control experiment.  This
# intentionally excludes the paper's extra photometric augmentation so that
# its behavior matches mmdetection_ccf/mmdet/models/backbones/swin.py.
MODEL:
    IMAGE_BACKBONE:
        FEATURE_PERTURBATION:
            ENABLED: True
            METHOD: np_plus
            PLACEMENT: output_branches
            PROBABILITY: 0.5
            NOISE_STD: 0.75
            MEAN_SCALE_FACTOR: 1.5
            EPS: 0.000001
